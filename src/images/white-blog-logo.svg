<svg xmlns="http://www.w3.org/2000/svg" width="680" height="200" viewBox="0 0 680 200" role="img" aria-labelledby="title desc">
  <title id="title">white-博客 Logo</title>
  <desc id="desc">淡紫色圆角图标，内部以翻开的书页构成字母 W，右侧为 white-博客 字标。</desc>

  <defs>
    <linearGradient id="lavender" x1="24" y1="20" x2="176" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DCCFFF"/>
      <stop offset="0.52" stop-color="#BFA7FF"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="222" y1="56" x2="716" y2="150" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#514265"/>
      <stop offset="0.62" stop-color="#6E5890"/>
      <stop offset="1" stop-color="#8E72D6"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#8064C4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Brand mark: an open book whose inner edges form a clear W. -->
  <g filter="url(#soft-shadow)">
    <rect x="20" y="20" width="160" height="160" rx="44" fill="url(#lavender)"/>
  </g>

  <path
    d="M49 58C65 58 82 64 100 78V141C84 126 67 120 49 120V58Z"
    fill="#FFFFFF"
    fill-opacity="0.96"
  />
  <path
    d="M151 58C135 58 118 64 100 78V141C116 126 133 120 151 120V58Z"
    fill="#FFFFFF"
    fill-opacity="0.88"
  />
  <path
    d="M49 58L70 120L85 84L100 141L115 84L130 120L151 58"
    fill="none"
    stroke="#9B7FE8"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path d="M100 78V141" stroke="#8E72D6" stroke-width="4" stroke-linecap="round" opacity="0.7"/>

  <!-- Editable wordmark. Use a Chinese-capable system font stack for stable web rendering. -->
  <text
    x="220"
    y="124"
    fill="url(#wordmark)"
    font-family="Inter, 'Segoe UI', 'Microsoft YaHei', 'PingFang SC', sans-serif"
    font-size="72"
    font-weight="700"
    letter-spacing="-2"
  >white<tspan fill="#B39AEF" font-weight="500">-</tspan><tspan fill="#8E72D6" font-size="66" letter-spacing="0">博客</tspan></text>
</svg>
